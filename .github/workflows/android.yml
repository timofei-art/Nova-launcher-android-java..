
name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract NOVA project
        run: |
          unzip -q NOVA_Launcher_GitHub_Android_Project.zip -d project

      - name: Build APK
        run: |
          cd project/NOVA_Launcher_Android_Starter
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Launcher-APK
          path: project/NOVA_Launcher_Android_Starter/app/build/outputs/apk/debug/*.apk
          
